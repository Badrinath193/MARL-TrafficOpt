[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-traffic-rl-service"
version = "0.1.0"
description = "SUMO/TraCI and reinforcement learning service for MARL TrafficOpt"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "traci>=1.20",
  "sumolib>=1.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]
